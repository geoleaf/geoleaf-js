# Dependabot — mises à jour de dépendances automatisées.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Deux écosystèmes : les dépendances npm du monorepo, et les actions du workflow CI.
#
# 🛑 LA RÈGLE D'EXPLOITATION, avant toute autre : **ne jamais merger le `package-lock.json`
# d'une PR Dependabot.** Reprendre les seuls deltas de `package.json`, régénérer le lock par
# `npm install` en local, et vérifier par `npm run ci:push` (qui fait un `npm ci` réel) avant
# de pousser.
#
# 🛑 SECONDE RÈGLE, et elle vaut pour le dépôt PUBLIC : **une PR Dependabot ne s'y merge
# jamais.** Le public est un miroir à sens unique — `port-to-public.cjs` recopie sur son clone
# chaque fichier porté depuis l'amont (`syncClone`, passe ②). Un `package.json` mergé là-bas
# est donc écrasé au portage suivant : le merge se défait tout seul, sans que rien ne rougisse.
# Le geste est mort par construction, pas risqué.
#
# 📌 Mais la PR publique n'est pas sans valeur — elle vaut comme **pré-vol gratuit**. Son run
# de CI éprouve les montées sur un CLONE FRAIS à 2-4 cœurs, conditions que le local ne rend
# pas. Mesuré le 07/09/2026 sur un lot de 13 montées : 98 gates jouées, une seule rouge, et
# c'était le cliquet d'intégrité du lock demandant à être resserré.
#
# ⚠️ Portée exacte de cet oracle, et elle est étroite : il prouve que ces VERSIONS passent, et
# **pas** que le lock régénéré en amont passera — celui-là reste à éprouver par `ci:push`. Il
# ne prouve pas non plus les versions qu'on installera : les plages sont en `^`, et `npm
# install` prend la plus récente qui satisfait. Sur ce même lot, `eslint` et `lint-staged`
# avaient déjà dépassé la cible de la PR au moment de la reprise.
#
# ── La PR « bump rollup à la racine » — décidée le 07/09/2026, elle REVIENDRA ────────────
#
# Une PR qui ne monte QUE la copie hissée à la racine (`rollup` 4.59.0 → 4.63.1, publique #16)
# se ferme, et le motif n'est pas structurel : il est de fond.
#
# La racine porte une copie ANCIENNE de `rollup` pour le `peerOptional` large de
# `@rollup/plugin-*` (`^1||^2||^3||^4`), pendant que les 20 workspaces résolvent leur `^4.63.1`
# déclaré en copies NICHÉES. Les effondrer est de l'hygiène, pas une correction : aucune gate
# ne l'exige. `IMPL` ne couvre que ce qui est chargé SANS être importé — `rollup` est importé,
# donc knip et SHIP-SPEC le voient déjà.
#
# 🛑 Et le changement NE TIENT PAS. Rien ne déclare `rollup` à la racine : la prochaine montée
# de rollup re-scindera à l'identique. Prendre le lock seul achète un état qui se défait tout
# seul, et rejoue cette PR chaque mois.
#
# 📌 La version durable serait une déclaration racine — le geste posé le même jour pour `tsx`
# (cf. `_tsxNote` dans le `package.json` racine). Mais là, c'était `IMPL-02` qui l'EXIGEAIT.
# Ici elle coûterait une seconde exemption knip sans qu'aucune gate ne la réclame. Cela se
# décide donc pour soi, jamais au détour d'une PR de montée.
#
# ⚠️ Cette note existe parce que le motif vivait dans un commentaire de PR fermée, sur un
# miroir que personne ne relit — et que la question se reposerait à neuf à chaque montée.
#
# Le motif est mécanique et il se reproduira : Dependabot régénère le lock EN ENTIER, y compris
# les binaires optionnels de toutes les plateformes (`cpu: ["wasm32"]` et consorts), et il
# déplace certains de leurs nœuds hors de la racine. `npm ci` re-résout alors une plage vers une
# version absente du lock et sort en `EUSAGE` :
#
#     npm error code EUSAGE
#     npm error `npm ci` can only install packages when your package.json and
#               package-lock.json are in sync.
#
# ⚠️ Le symptôme ne désigne PAS le paquet monté dans la PR. Une PR qui ne touche qu'une
# dépendance sans rapport rend la même erreur, parce que la cause est la régénération du lock,
# pas la montée. Chercher le coupable dans le diff de `package.json` fait perdre le fil.

version: 2
updates:
    # ── npm ──────────────────────────────────────────────────────────────────────────────
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 10
      labels:
          - "dependencies"
      # 🛑 `security` a été RETIRÉ de cette liste le 07/09/2026, et ce n'est pas un allègement :
      # étiqueter `security` **toute** montée de version rend une vraie PR d'avis de sécurité
      # indistinguable du bruit hebdomadaire. Le label y perdrait exactement ce qui en fait un
      # signal. Il n'existe donc dans aucun des deux dépôts, délibérément.
      #
      # ⚠️ Un label absent du dépôt ne bloque pas la PR : elle arrive NUE, et Dependabot le
      # signale par e-mail (« The following labels could not be found: … »). La phrase qui
      # tenait ici jusqu'au 07/09 affirmait l'inverse — « ignoré EN SILENCE, rien ne le
      # signale » — et elle était fausse. Elle a tenu parce que personne ne l'avait éprouvée :
      # mesuré ce jour-là, les 30 PR Dependabot des deux dépôts, depuis la première, portaient
      # `labels=[]`. Ce bloc n'avait JAMAIS rien fait.
      #
      # 📌 Rien ici ne le vérifie, et c'est assumé : une gate devrait interroger l'API GitHub,
      # donc sortir du périmètre hors-ligne de `ci:local` et devenir instable. Le contrôle est
      # manuel, au prochain changement de labels :
      #     gh label list -R <dépôt> --json name --jq '[.[].name]'
      # Les labels nommés dans ce fichier doivent y figurer — dans les DEUX dépôts, ce fichier
      # étant porté à l'octet près et la partition ne sachant pas le faire diverger.
      #
      # 📌 Aucun `reviewers:` ici, délibérément. La désignation des relecteurs vit dans
      # `.github/CODEOWNERS`, qui est le mécanisme natif de GitHub et couvre **toutes** les PR,
      # pas seulement celles de Dependabot. Une seconde liste écrite à la main serait un second
      # encodage du même fait, libre de diverger du premier.

      ignore:
          # ── typescript : majeures ignorées ────────────────────────────────────────────
          # 🛑 BLOQUANT, pas risqué : la majeure suivante casse deux contrats de pair.
          #   • `@typescript-eslint/*` déclare une plage qui s'arrête avant
          #   • `typedoc` — y compris sa DERNIÈRE version publiée — ne la supporte pas
          # Sans TypeDoc compatible, la gate `docs:api` n'a plus de sortie du tout.
          #
          # Rouvrir cette ligne le jour où les deux publient leur support, et le vérifier
          # plutôt que le supposer :
          #     npm view typedoc peerDependencies
          #     npm view @typescript-eslint/eslint-plugin peerDependencies
          - dependency-name: "typescript"
            update-types:
                - "version-update:semver-major"

          # ── @types/node : majeures ignorées ───────────────────────────────────────────
          # Les types doivent décrire le Node qu'on EXÉCUTE. Le dépôt fixe sa version dans
          # `.nvmrc` et dans `engines.node` ; typer contre une majeure supérieure fait accepter
          # par `tsc` des API absentes à l'exécution — un typecheck vert qui ment, et aucune
          # gate ne peut le voir.
          #
          # Cette ligne se lève en même temps que la majeure de Node, jamais avant.
          - dependency-name: "@types/node"
            update-types:
                - "version-update:semver-major"

      # Regroupe les mineures et correctifs pour réduire le bruit de PR.
      groups:
          dev-dependencies:
              dependency-type: "development"
              update-types:
                  - "minor"
                  - "patch"
          production-dependencies:
              dependency-type: "production"
              update-types:
                  - "minor"
                  - "patch"

    # ── GitHub Actions ───────────────────────────────────────────────────────────────────
    # ⚠️ Les `uses:` du workflow sont épinglés par SHA, pas par étiquette de version — une
    # étiquette est mutable, un SHA ne l'est pas. Dependabot sait monter un SHA épinglé et
    # réécrit le commentaire de version qui le suit ; c'est ce qui rend l'épinglage tenable.
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
          - "ci"
