name: Publish to npm

# Publication des paquets publiables par TRUSTED PUBLISHING (OIDC) — sans jeton, sans OTP.
#
# ## Pourquoi ce workflow existe
#
# La publication manuelle du 12/08/2026 a coûté 14 codes d'authenticator, et npm réclame un
# `EOTP` pour toute écriture de ce compte — quel que soit le type de jeton, `auth-only` ou non :
# quatre hypothèses ont été éprouvées, les quatre réfutées.
# Le trusted publishing supprime le problème à la racine : GitHub Actions présente un jeton
# OIDC éphémère, npm vérifie qu'il vient bien de CE dépôt et de CE fichier de workflow.
#
# 🛑 PRÉREQUIS QUI COMMANDE L'ORDRE — mesuré, non supposé : « The package you're configuring
# must already exist on the npm registry » (docs.npmjs.com/cli/v11/commands/npm-trust).
# On ne déclare pas un éditeur de confiance pour un paquet inexistant. Chaque paquet doit donc
# être publié UNE fois à la main avant que ce workflow puisse le servir. C'est le prix d'entrée,
# et il ne se repaie pas.
# ⚠️ Ne pas recopier ici un NOMBRE de paquets : il a dit « 14 » pendant que le corps disait
# « 15 » et que `packages.cjs` en comptait 17. Il se dérive — `npm run versions:check`.
#
# ## Ce que ce workflow N'EST PAS
#
# Ce n'est pas une gate de parité. `scripts/lib/ci-parity.cjs` lit TOUT `.github/workflows/`,
# mais classe en LIVRAISON tout fichier déclenché par `tags:` sans `branches:` — celui-ci en
# est —, et le sort de la comparaison avec `ci:local`. La propriété « ci:local ⊇ CI » vaut pour
# ce qui VÉRIFIE, pas pour ce qui LIVRE.
#
# ## Ce qu'il EST devenu le 04/09/2026 (R5) — une garde devant l'acte irréversible
#
# Jusqu'à cette date il franchissait **une seule** gate bloquante avant son premier tarball
# (`check-dist-integrity.cjs`), vérifiait les types APRÈS publication — et sur le monorepo, pas
# sur ce qui était parti —, installait `npm@latest` non épinglé sous `id-token: write`, et rien
# ne reliait le tag publié à un CI vert. Un tarball npm est IMMUABLE : il ne se corrige pas, il
# se remplace, et tout consommateur qui a installé le mauvais le garde jusqu'à son prochain bump.
#
# Le job `verify` porte désormais ces contrôles, et `publish` en dépend.

on:
    push:
        tags:
            - "v*"
    # Déclenchement manuel : la publication est un acte irréversible, on doit pouvoir la
    # relancer sans forger un tag.
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Répétition à blanc — traverse verify puis tous les `npm publish --dry-run`, sans rien publier"
                type: boolean
                default: false

permissions:
    # ⚠️ LA ligne qui rend l'OIDC possible. Sans elle, npm refuse et le run meurt sur un EOTP
    # que personne ne pourra satisfaire depuis un runner.
    id-token: write
    contents: read
    # Lecture de l'historique des runs — le job `verify` demande si CE SHA porte un `ci.yml` vert.
    actions: read

jobs:
    # ── verify — tout ce qui peut encore être repris ────────────────────────────────
    #
    # 🛑 Il tourne AVANT `publish` et non dans le même job, et le `needs:` est le sujet :
    # ce qui échoue ici n'a rien publié. Le prix est un build de plus (les jobs ne
    # partagent pas de disque) ; il se paie une fois par publication, c'est-à-dire
    # rarement, contre un tarball faux qui, lui, ne se reprend jamais.
    verify:
        runs-on: ubuntu-latest
        steps:
            # Les `uses:` sont épinglés par SHA, jamais par étiquette — une étiquette est
            # mutable, un SHA ne l'est pas. Mêmes SHA que `ci.yml`, délibérément : deux
            # workflows qui épinglent des versions différentes de la même action divergent
            # sans que rien ne le dise.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".nvmrc"
                  registry-url: "https://registry.npmjs.org"
                  cache: "npm"

            # 🛑 Le SHA publié doit porter un `ci.yml` VERT, et c'est la première étape parce
            # qu'elle échoue en secondes — un rouge découvert après le build aurait coûté le
            # build. Rien ne reliait le tag au CI jusqu'au 04/09/2026 : un tag posé sur une
            # branche jamais éprouvée publiait.
            #
            # ⚠️ L'ORACLE FILTRE PAR WORKFLOW, JAMAIS PAR COMMIT SEUL. `gh api
            # .../commits/<sha>/check-runs → total_count` est FAUX sur ce dépôt et faux dans le
            # sens dangereux : mesuré le 10/08/2026, il rend 5 sur un push qui n'a déclenché
            # AUCUN run de `ci.yml` — quatre runs Dependabot plus un contrôle de configuration.
            # Le lecteur y lit « le CI a tourné » et conclut l'inverse de la vérité.
            #
            # 🛑 ET `--commit` EXIGE LE SHA COMPLET, sans le dire. Mesuré le 04/09/2026 sur un
            # commit dont le run est vert : le SHA court rend **0**, le SHA de 40 caractères rend
            # **1**. `$GITHUB_SHA` est toujours complet, donc cette étape est juste — mais une
            # réécriture qui y passerait un SHA abrégé produirait un refus PERMANENT et
            # inexplicable, sur une requête qui a l'air correcte. L'échec est fermé (on refuse de
            # publier), donc il ne perd rien ; il coûte juste très cher à diagnostiquer.
            #
            # ⚠️ `set -e` fait AUSSI partie de la garde : si `gh` échoue (jeton, quota, réseau),
            # l'étape meurt au lieu de conclure. Un oracle indisponible n'est pas un oracle vert.
            - name: Ce SHA porte-t-il un `ci.yml` vert ?
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  verts=$(gh run list --workflow=ci.yml --commit "$GITHUB_SHA" \
                      --json conclusion --jq '[.[] | select(.conclusion=="success")] | length')
                  echo "runs ci.yml verts sur $GITHUB_SHA : $verts"
                  if [ "$verts" -lt 1 ]; then
                      echo "::error::Aucun run VERT de ci.yml sur $GITHUB_SHA — rien ne prouve que cet arbre passe les gates."
                      echo "Remède : déclencher ci.yml sur ce SHA (onglet Actions → CI → Run workflow) et attendre le vert."
                      echo "⚠️ Un push portant un marqueur de saut de CI n'a JAMAIS déclenché de run : c'est le cas le plus fréquent ici."
                      exit 1
                  fi

            # 🛑 `npm` ÉPINGLÉ sur une version DÉDIÉE à la publication — et NON plus dérivé de
            # `packageManager`, parce que cette dérivation a cassé l'OIDC. Mesuré le 08/09/2026.
            #
            # Le motif du 04/09 était juste — ne pas installer `npm@latest` sous `id-token:
            # write` — mais son moyen a RÉTROGRADÉ npm : `packageManager` vaut `npm@11.6.2`
            # (posé en février, jamais remonté) là où `npm@latest` valait déjà 12.0.2. Or les
            # trois publications OIDC réussies de ce dépôt — 15/08 (editor, measure, print,
            # table) et 01/09 (file-import) — ont toutes tourné sous npm 12, et leur log porte
            # « Signed provenance statement … from GitHub Actions ». Le PREMIER run sous
            # 11.6.2, le 08/09, n'a pas même tenté l'OIDC : `PUT` non authentifié, `E404`, deux
            # fois, depuis l'atelier puis depuis le public.
            #
            # ⚠️ Personne ne l'avait vu, et la raison vaut d'être écrite : `@geoleaf/core` est
            # la PREMIÈRE étape de publication, et il a été SAUTÉ dans tous les runs antérieurs,
            # déjà au registre à la version du moment. Le seuil « ≥ 11.5.1 » de la doc npm n'a
            # donc jamais été éprouvé ici — il est nécessaire, il n'est pas suffisant.
            #
            # ⚠️ Une SECONDE source de version est assumée, contre l'argument du 04/09.
            # `packageManager` gouverne le CI et le lockfile du dépôt entier ; la publication a
            # une exigence propre — le trusted publishing à permissions granulaires est une
            # fonctionnalité npm 12 — qui ne doit pas commander les 105 autres gates. Le
            # plancher ci-dessous refuse tout majeur < 12 : cette source ne peut donc pas
            # dériver vers le bas en silence, ce qui est exactement ce qui vient d'arriver.
            - name: npm épinglé pour la publication (npm 12 — trusted publishing)
              env:
                  NPM_PUBLISH_VERSION: "12.0.2"
              run: |
                  set -euo pipefail
                  npm install -g "npm@${NPM_PUBLISH_VERSION}"
                  ver=$(npm --version)
                  major=${ver%%.*}
                  if [ "$major" -lt 12 ]; then
                      echo "::error::npm $ver — majeur < 12. Le trusted publishing ne s'active pas : le PUT partirait NON AUTHENTIFIÉ et npm rendrait un E404 (mesuré le 08/09/2026, deux fois)."
                      exit 1
                  fi
                  echo "npm $ver"

            - run: npm ci

            # 🛑 LA garde de R5. Elle joue le sous-ensemble de `ci:local` marqué
            # `release: true` — dérivé, jamais recopié —, plus l'assertion finale sur les
            # stubs CSS. Son en-tête dit ce qu'un vert ici ne dit PAS : `GEOLEAF_CONSUMERS`
            # n'existe sur aucun runner, donc le contrat inverse SAUTE et le résumé le
            # NOMME. Le protocole de publication exige, avant de déclencher ce workflow :
            #     GEOLEAF_CONSUMERS=<dir> npm run release:check -- --strict
            - name: release:check — les gates devant un acte irréversible
              run: npm run release:check

    # ── publish — à partir d'ici, rien ne se reprend ────────────────────────────────
    publish:
        needs: verify
        runs-on: ubuntu-latest
        env:
            # Répétition à blanc : `publish-one.cjs` et `publish-plugins.cjs` acceptent tous
            # deux `--dry-run`. Vide sur un tag, donc la publication réelle reste le
            # comportement par défaut et le mode sec un choix explicite.
            DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".nvmrc"
                  registry-url: "https://registry.npmjs.org"
                  cache: "npm"

            # 🔗 Même épinglage que dans `verify` — le motif y est écrit une fois.
            - name: npm épinglé pour la publication (npm 12 — trusted publishing)
              env:
                  NPM_PUBLISH_VERSION: "12.0.2"
              run: |
                  set -euo pipefail
                  npm install -g "npm@${NPM_PUBLISH_VERSION}"
                  ver=$(npm --version)
                  major=${ver%%.*}
                  if [ "$major" -lt 12 ]; then
                      echo "::error::npm $ver — majeur < 12. Le trusted publishing ne s'active pas : le PUT partirait NON AUTHENTIFIÉ et npm rendrait un E404 (mesuré le 08/09/2026, deux fois)."
                      exit 1
                  fi
                  echo "npm $ver"

            - run: npm ci

            # Le build complet, pas `build:all` : `--filter=@geoleaf/core` ne tire que les
            # dépendances DU CORE, or les plugins dépendent de lui et non l'inverse — 10 des
            # 12 garderaient leur `dist/` d'avant (CLAUDE.md §Points d'attention).
            - run: npx turbo run build

            # 🛑 CETTE ÉTAPE DÉCIDE DU CONTENU DES TARBALLS. Sans elle, les `.d.ts` publiés des
            # libs et des 6 plugins portent des imports CSS qui ne résolvent pas chez
            # l'intégrateur — mesuré : 11 des 32 imports, invisibles ici parce que le core, lui,
            # était couvert. C'est le défaut que les stubs CSS prétendaient avoir fermé et n'avaient fermé
            # qu'au tiers.
            - name: Stubs de type CSS (.d.ts publiés)
              run: node scripts/emit-css-type-stubs.cjs

            # 🛑 ET L'ORACLE DE L'ÉTAPE PRÉCÉDENTE, parce qu'elle a déjà été DÉFAITE par la
            # suite. Jusqu'au 04/09/2026, `npm publish` déclenchait le `prepublishOnly` du
            # core — `rimraf dist` puis un rebuild qui n'appelle jamais l'émetteur — et le
            # tarball partait sans ses 21 stubs. Mesuré au registre sur `@geoleaf/core@3.1.0` :
            # 0 `*.css.d.ts` publié contre 21 sur le disque. La cause est fermée par
            # `--ignore-scripts` dans `publish-one.cjs` ; cette étape est ce qui rend la
            # fermeture VÉRIFIABLE, ici, sur l'arbre qui va être empaqueté.
            - name: Stubs de type CSS — état final de dist/ (CSS-STUBS --check)
              run: node scripts/emit-css-type-stubs.cjs --check

            # Le tarball est immuable : un chunk orphelin publié l'est définitivement.
            - name: Intégrité de dist/ avant tout pack
              run: node scripts/check-dist-integrity.cjs

            # ⚠️ Cette étape était la DERNIÈRE du workflow jusqu'au 04/09/2026, sous un
            # commentaire qui affirmait juger « ce qui vient d'être publié, et non le
            # monorepo ». C'était faux : `verify-published-types.cjs` ne contacte jamais le
            # registre — il itère sur `registry.all()` et résout des cibles SUR LE DISQUE, son
            # propre docblock le dit. Elle ne vérifiait donc ni les tarballs, ni au bon moment.
            # Remise à sa place : avant le premier pack, où ce qu'elle mesure a un sens.
            - name: Les déclarations livrées sont atteignables (PUB-TYPES)
              run: node scripts/verify-published-types.cjs

            # ── Publication, dans l'ordre imposé par le graphe de dépendances ──
            #
            # Le core d'abord : les plugins le déclarent en `^3.0.0`, donc sans lui leurs
            # installs échouent toutes. `field-renderer` ensuite : `editor` en dépend.
            # 🛑 PAS un `npm publish` NU, et le motif est mesuré. Ces deux étapes l'étaient
            # jusqu'au 15/08/2026 : `core@3.0.0` et `field-renderer@1.0.0` étant au registre
            # depuis le 12/08, npm rendait `E403 You cannot publish over the previously
            # published versions` et le run mourait ICI — sans jamais atteindre les plugins
            # qu'il existe pour publier. Un correctif qui ne touche que des plugins était donc
            # INPUBLIABLE par ce workflow.
            #
            # ⚠️ Ce n'est pas une tolérance ajoutée, c'est la promesse du bloc `on:` tenue :
            # « la publication est un acte irréversible, on doit pouvoir la relancer ». Seuls
            # les plugins l'étaient. `publish-one.cjs` saute ce que le registre porte déjà
            # EN LE DISANT — sauter n'est pas publier, et la sortie ne laisse pas confondre.
            - name: "@geoleaf/core"
              run: node scripts/publish-one.cjs @geoleaf/core $DRY

            - name: "@geoleaf/field-renderer"
              run: node scripts/publish-one.cjs @geoleaf/field-renderer $DRY

            # Les plugins de `PUBLISHED_PLUGINS` — une liste de POLITIQUE, écrite à la main,
            # dont le docblock interdit l'élargissement par effet de bord. Le script est
            # REJOUABLE : un paquet déjà au registre est sauté en le disant, et son décompte
            # final sépare publiés et sautés — sans quoi « n/n » se lirait comme n publications
            # là où il pourrait n'y en avoir eu que trois.
            - name: Les plugins publiables
              run: npm run publish:plugins -- $DRY
