# GeoLeaf — the proof bench's gateway ON A RUNNER.
#
# 🛑 THIS FILE IS NOT A CONVENIENCE. On the dev machine Traefik splits one hostname into
# two services by path; a runner has no Traefik, and publishing two ports would give the
# bench TWO ORIGINS. The connector adds `Authorization: Bearer` only to the requests under
# its single `baseUrl` (SERVER_CONTRACT.md §1.4), so the pull would then go out
# unauthenticated — against a bench whose anonymous role can SELECT, it would still be
# GREEN, and §1.4 would have stopped being exercised without anything saying so.
#
# The split therefore has to be reproduced, and this is the smallest thing that does it.

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/bench.crt;
    ssl_certificate_key /etc/nginx/certs/bench.key;
    server_name _;

    # Never let a proxied answer be cached between two specs of the same run.
    add_header Cache-Control "no-store" always;

    # 🛑 Docker's embedded DNS, and `proxy_pass` THROUGH A VARIABLE. Measured on
    # 20/09/2026: with a literal upstream, nginx resolves it AT STARTUP and exits
    # `[emerg] host not found in upstream "postgrest"` — it boots faster than the services
    # it fronts, and `depends_on` does not wait for their DNS. Through a variable the
    # resolution is deferred to the first request, so a slow upstream is a slow first
    # answer instead of a dead gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /ogc → pygeoapi, prefix stripped. With a variable `proxy_pass` carries no URI of its
    # own, so the stripping is the `rewrite` — the trailing-slash trick does not apply.
    location /ogc/ {
        set $ogc http://pygeoapi:80;
        rewrite ^/ogc/(.*)$ /$1 break;
        proxy_pass $ogc;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /ogc {
        return 301 /ogc/;
    }

    # Everything else → PostgREST at the root: the `collection` dialect posts to
    # {baseUrl}/{layerId}, which IS a PostgREST table endpoint.
    location / {
        set $rest http://postgrest:3000;
        proxy_pass $rest$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
