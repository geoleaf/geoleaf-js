# Dev server for GeoLeaf deploy variants — served behind the shared Traefik
# proxy (network "web"), which terminates TLS (mkcert cert) and proxies here
# over http. Parent ./deploy is mounted at /usr/share/nginx/sites; one server{}
# per variant maps a *.geoleaf.local.test host to its root.
# `no-store` keeps rebuilds visible without an HTTP-cache hard refresh.
# (No CSP sub_filter needed: the browser loads over https, so the page's
#  `upgrade-insecure-requests` directive is already satisfied.)
#
# Each vhost falls back to a named @missing location when its variant folder has
# not been built: a missing `root` otherwise yields a bare nginx 404 page that
# names neither the cause nor the fix. The fallback is scoped to `location = /`
# (exact match) so a genuinely absent asset still returns a real 404 — turning
# every 404 into a hint would mask real errors.
#
# ── gzip_static (socle-init S4.2) ────────────────────────────────────────────
#
# `build-deploy.cjs` émet un `.gz` à côté de chaque artefact texte. SANS cette directive,
# ces fichiers existent et ne sont JAMAIS servis : la tâche sortirait verte en n'ayant rien
# changé pour l'utilisateur. C'est la moitié qui manquait à l'énoncé de la roadmap, qui ne
# demandait que de produire les fichiers.
#
# ⚠️ `brotli_static` N'EST PAS POSÉ, et c'est une contrainte, pas un oubli : `nginx:alpine`
# (cf. docker-compose.dev.yml) n'embarque pas `ngx_brotli`, un module tiers qui demande une
# recompilation de nginx. Les `.br` sont produits pour le serveur de PRODUCTION et ne sont
# donc pas éprouvés ici — ne pas les croire servis sous prétexte qu'ils existent.
#
# 🛑 VÉRIFIER DEPUIS LE CONTENEUR, PAS DEPUIS LE VHOST HTTPS — mesuré le 07/08/2026.
# Passer par Traefik rend l'ORIGINAL décompressé (249 967 o, aucun `Content-Encoding`) : le
# proxy ne relaie pas `Accept-Encoding` tel quel. La conclusion « gzip_static ne marche pas »
# était fausse, et elle aurait fait retirer une directive qui fonctionne. La bonne mesure
# court-circuite le proxy :
#
#   docker exec geoleaf-dev-nginx sh -c "wget -q -S --header='Accept-Encoding: gzip' \
#     --header='Host: demo.full.geoleaf.local.test' -O /dev/null \
#     http://127.0.0.1/dist/geoleaf.esm.js 2>&1 | grep -iE 'Content-Encoding|Content-Length'"
#
# Relevé attendu, et obtenu : `Content-Encoding: gzip` avec un `Content-Length` égal à l'octet
# près à la taille du `.gz` sur disque (72 922). C'est cette égalité qui prouve que le fichier
# PRÉ-compressé est servi, et non une compression à la volée qui donnerait une autre taille.
gzip_static on;

# ── Type MIME de `.mjs` (MapLibre 6) ─────────────────────────────────────────
#
# 🛑 SANS CETTE LIGNE, RIEN NE BOOTE. La table `mime.types` de nginx ne connaît que `js` ; un
# `.mjs` part donc en `application/octet-stream` (le `default_type`), et Chromium REFUSE
# d'exécuter un module servi sous un type non-JavaScript — « Strict MIME type checking is
# enforced for module scripts ». Depuis MapLibre 6, le moteur entier est en `.mjs` : ni l'app,
# ni les sondes, ni l'E2E ne démarrent. Mesuré le 08/08/2026 sur ce conteneur :
# `grep -c mjs /etc/nginx/mime.types` → 0.
#
# ⚠️ Cette contrainte VIT HORS DU DÉPÔT pour l'intégrateur — aucune gate ne peut la voir chez
# lui. Elle est donc écrite aussi dans la doc produit (README, GETTING_STARTED), à côté de la
# recette d'auto-hébergement.
#
# Vérification, depuis le conteneur pour court-circuiter le proxy (même précaution que pour
# gzip_static ci-dessus) :
#   docker exec geoleaf-dev-nginx sh -c "wget -q -S --header='Host: demo.geoleaf.local.test' \
#     -O /dev/null http://127.0.0.1/vendor/maplibre-gl/maplibre-gl.mjs 2>&1 | grep -i Content-Type"
types {
    text/javascript mjs;
}

# core
server {
    listen 80;
    server_name demo.geoleaf.local.test;
    root /usr/share/nginx/sites/deploy-core;
    index index.html;
    add_header Cache-Control "no-cache" always;
    # Anti-clickjacking (M2): deny framing at the HTTP layer. frame-ancestors is
    # the modern CSP equivalent; X-Frame-Options covers legacy browsers.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # S6.1 — MIME sniffing. Cet en-tête n'est honoré QU'EN HTTP : la balise
    # `<meta http-equiv>` qui vivait dans index.html n'a jamais rien protégé.
    # Gardé par NGINX-01 (scripts/verify-app-template.cjs) sur TOUS les blocs :
    # nginx n'hérite pas `add_header` dans un bloc qui déclare le sien, donc un
    # oubli sur un seul vhost est un trou complet et silencieux.
    add_header X-Content-Type-Options "nosniff" always;
    location = / { try_files /index.html @missing; }
    location / { try_files $uri $uri/ =404; }
    location @missing {
        default_type text/plain;
        return 503 "deploy/deploy-core/ absent — lancer : npm run build:deploy\n";
    }
}

# full (storage + cog + editor) — depuis 5.5, la SEULE variante à plugins gatés :
# elle porte l'édition ET offline-ui, donc le cycle hors-ligne complet.
# ⚠️ Le vhost `demo.addpoi.` est retiré AVEC la variante (B-129, issue 1) : `deploy-addpoi`
# n'est plus produite, et un vhost survivant aurait servi un 503 dont le message —
# « lancer npm run build:deploy » — serait devenu définitivement faux.
server {
    listen 80;
    server_name demo.full.geoleaf.local.test;
    root /usr/share/nginx/sites/deploy-full;
    index index.html;
    add_header Cache-Control "no-cache" always;
    # Anti-clickjacking (M2): deny framing at the HTTP layer. frame-ancestors is
    # the modern CSP equivalent; X-Frame-Options covers legacy browsers.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # S6.1 — MIME sniffing. Cet en-tête n'est honoré QU'EN HTTP : la balise
    # `<meta http-equiv>` qui vivait dans index.html n'a jamais rien protégé.
    # Gardé par NGINX-01 (scripts/verify-app-template.cjs) sur TOUS les blocs :
    # nginx n'hérite pas `add_header` dans un bloc qui déclare le sien, donc un
    # oubli sur un seul vhost est un trou complet et silencieux.
    add_header X-Content-Type-Options "nosniff" always;
    location = / { try_files /index.html @missing; }
    location / { try_files $uri $uri/ =404; }
    location @missing {
        default_type text/plain;
        return 503 "deploy/deploy-full/ absent — lancer : npm run build:deploy\n";
    }
}

# coverage (instrumented copy of deploy-core — a distinct AXIS, not a plugin variant).
# Serves the E2E target `coverage` (e2e/helpers/base-url.js), which 07-boot-sequence
# needs for `window.__coverage__`.
server {
    listen 80;
    server_name demo.coverage.geoleaf.local.test;
    root /usr/share/nginx/sites/deploy-coverage;
    index index.html;
    add_header Cache-Control "no-cache" always;
    # Anti-clickjacking (M2): deny framing at the HTTP layer. frame-ancestors is
    # the modern CSP equivalent; X-Frame-Options covers legacy browsers.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # S6.1 — MIME sniffing. Cet en-tête n'est honoré QU'EN HTTP : la balise
    # `<meta http-equiv>` qui vivait dans index.html n'a jamais rien protégé.
    # Gardé par NGINX-01 (scripts/verify-app-template.cjs) sur TOUS les blocs :
    # nginx n'hérite pas `add_header` dans un bloc qui déclare le sien, donc un
    # oubli sur un seul vhost est un trou complet et silencieux.
    add_header X-Content-Type-Options "nosniff" always;
    location = / { try_files /index.html @missing; }
    location / { try_files $uri $uri/ =404; }
    location @missing {
        default_type text/plain;
        # NOT `npm run build:deploy` — that wipes deploy/ and does NOT rebuild this
        # variant. The two commands always go together, in this order.
        return 503 "deploy/deploy-coverage/ absent — lancer : node scripts/build-deploy-coverage.cjs\n";
    }
}

# local — LE DÉPLOYÉ DE TRAVAIL. Même jeu de plugins que `full`, plus le bootstrap dev
# (`connector.local.js`, jeton `geoleaf_editor`) que les variantes LIVRABLES ne reçoivent
# jamais. C'est la seule variante depuis laquelle on éprouve l'authentification contre le
# backend distant, et c'est la seule dont l'hôte figure dans la garde d'`apps/geoleaf-app/init.js`.
#
# 🛑 CE VHOST SERT UN SECRET, ET C'EST ASSUMÉ. `GET /connector.local.js` y rend le jeton en
# clair — comme sur n'importe quel fichier servi statiquement. C'est précisément pourquoi la
# variante existe : concentrer en un seul endroit, non livrable et nommé, ce qui était
# auparavant recopié dans `deploy-core` et `deploy-full`. Ne jamais faire pointer ce root vers
# une variante livrable, et ne jamais livrer `deploy-local/`.
#
# ⚠️ Absent du hosts Windows par défaut, contrairement aux trois autres — une entrée
# `127.0.0.1 demo.local.geoleaf.local.test` est à ajouter côté Windows (action impossible
# depuis WSL). Playwright, lui, passe par `--host-resolver-rules` (e2e/helpers/base-url.js).
server {
    listen 80;
    server_name demo.local.geoleaf.local.test;
    root /usr/share/nginx/sites/deploy-local;
    index index.html;
    add_header Cache-Control "no-cache" always;
    # Anti-clickjacking (M2): deny framing at the HTTP layer. frame-ancestors is
    # the modern CSP equivalent; X-Frame-Options covers legacy browsers.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # S6.1 — MIME sniffing. Cet en-tête n'est honoré QU'EN HTTP : la balise
    # `<meta http-equiv>` qui vivait dans index.html n'a jamais rien protégé.
    # Gardé par NGINX-01 (scripts/verify-app-template.cjs) sur TOUS les blocs :
    # nginx n'hérite pas `add_header` dans un bloc qui déclare le sien, donc un
    # oubli sur un seul vhost est un trou complet et silencieux.
    add_header X-Content-Type-Options "nosniff" always;
    location = / { try_files /index.html @missing; }
    location / { try_files $uri $uri/ =404; }
    location @missing {
        default_type text/plain;
        # NOT `npm run build:deploy` — celui-ci ne produit QUE les livrables, délibérément.
        return 503 "deploy/deploy-local/ absent — lancer : npm run build:deploy:local\n";
    }
}
