ind":"dir","display":"offline-ui","sz":"38f","name":"ok","location":"ok","existence":"justifie","rule":"N2","severity":"info","description":"Le plugin qui n'embarque plus le moteur de stockage : depuis le S14 Phase B il ne livre que l'UI hors-ligne — bouton de cache, sélecteur de couches, panneau de synchronisation, i18n et barre d'outils","rationale":"✅ SOLDÉ au STRUCT S3 (26/07/2026) — le renommage est EXÉCUTÉ sur ses quatre axes : répertoire, paquet npm (`@geoleaf-plugins/offline-ui`), bundle (`geoleaf-offline-ui.plugin.js`) et id de plugin runtime (`\"offline-ui\"`). Le constat qui motivait le verdict tenait : `src/entry.ts` s'auto-titrait « Entry point (offline UI) » tandis que le paquet s'appelait `storage`, et « storage » désignait TROIS artefacts — ce plugin, `core/src/kernel/storage/` (la façade `GeoLeaf.Storage`) et `core/src/capabilities/offline/` (le moteur réel). La façade core garde son nom : `GeoLeaf.Storage` reste l'objet de façade, et le plugin ne le revendique plus. Deux corrections mesurées à l'énoncé du geste, toutes deux issues du pré-vol : (a) l'id runtime n'était PAS « un contrat avec les profils JSON » — zéro occurrence dans `profiles/`, dont le fichier de config s'appelait DÉJÀ `offline.json`, et le plugin n'appelle aucun `getModuleConfig` ; le renommer a donc coûté 5 sites source, ~10 assertions et 2 sélecteurs E2E, pas un élargissement de périmètre. (b) `verify-seam-drift` n'avait plus rien à ré-épingler, le seam `storage-contract` ayant été retiré à l'API publique S4.4. TROIS gates silencieuses traitées dans le commit du renommage, chacune VUE rougir puis reverdir : `verify-core-standalone` (sa regex de référence de plugin) ; `test-scope.cjs` EXCLUDED_FROM_ROOT_RUN, dotée au passage de la validation d'existence qui lui manquait et qui EST la cause de sa cécité ; `verify-app-template` GATED_PLUGINS — celle-ci absente de la roadmap, et silencieuse parce que sa boucle APP-05 fait `continue` sur une aiguille introuvable, désormais résolue par const LABEL={justifie:"justifié",renommer:"renommer",deplacer:"déplacer",
fusionner:"fusionner",supprimer:"supprimer","?":"?"};
const collapsed=new Set();
const tree=document.getElementById("tree"),q=document.getElementById("q"),
      shown=document.getElementById("shown");

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cls(v){return v==="ok"?"ok":v==="KO"?"ko":"qm"}

// A directory survives the filter when any descendant matches: hiding the parent would
// orphan its matching children and make the filter look like it dropped rows.
function keptSet(){
  const vs=new Set([...document.querySelectorAll(".vf")].filter(c=>c.checked).map(c=>c.value));
  const term=q.value.trim().toLowerCase();
  const keep=new Set();
  for(let i=NODES.length-1;i>=0;i--){
    const n=NODES[i];
    const hit=vs.has(n.existence) &&
      (!term||(n.key+" "+(n.description||"")).toLowerCase().includes(term));
    if(hit||keep.has(n.key)){keep.add(n.key); if(n.parent)keep.add(n.parent);}
  }
  return keep;
}
function render(){
  const keep=keptSet();
  let skipUnder=null,out="",visible=0;
  for(const n of NODES){
    if(!keep.has(n.key))continue;
    if(skipUnder&&n.key.startsWith(skipUnder+"/"))continue;
    skipUnder=(n.kind==="dir"&&collapsed.has(n.key))?n.key:null;
    visible++;
    const ind=(n.depth-1)*13;
    const tw=n.kind==="dir"
      ?'<span class="tw" data-k="'+esc(n.key)+'">'+(collapsed.has(n.key)?"▸":"▾")+'</span>'
      :'<span class="tw"></span>';
    out+='<div class="row '+n.kind+'">'
      +'<span class="el" style="padding-left:'+ind+'px" title="'+esc(n.key)+'">'+tw+esc(n.display)+'</span>'
      +'<span class="num">'+esc(n.sz)+'</span>'
      +'<span class="v '+cls(n.name)+'">'+esc(n.name)+'</span>'
      +'<span class="v '+cls(n.location)+'">'+esc(n.location)+'</span>'
      +'<span class="v ex-'+esc(n.existence)+'">'+esc(LABEL[n.existence]||n.existence)+'</span>'
      +(n.description
        ?'<span class="desc" style="padding-left:'+(ind+26)+'px">'+esc(n.description)
          +(n.rule?' <em>['+esc(n.rule)+(n.severity?" · "+esc(n.severity):"")+']</em>':'')+'</span>'
        :'')
      +'</div>';
  }
  tree.innerHTML=out;
  shown.textContent=visible+" lignes";
}
tree.addEventListener("click",e=>{
  const t=e.target.closest(".tw[data-k]"); if(!t)return;
  const k=t.dataset.k; collapsed.has(k)?collapsed.delete(k):collapsed.add(k); render();
});
q.addEventListener("input",render);
document.querySelectorAll(".vf").forEach(c=>c.addEventListener("change",render));
document.getElementById("expand").onclick=()=>{collapsed.clear();render()};
document.getElementById("collapse").onclick=()=>{
  for(const n of NODES) if(n.kind==="dir"&&n.depth>=3) collapsed.add(n.key); render()};
// 900 rows expanded is a wall, not a view: open to package level, deeper stays folded.
for(const n of NODES) if(n.kind==="dir"&&n.depth>=4) collapsed.add(n.key);
render();
</script></body></html>
